services:
  # ==========================================
  # Honey Chain Backend API (NestJS Monorepo)
  # ==========================================
  - type: web
    name: honey-chain-api
    runtime: node
    plan: free
    region: oregon
    buildCommand: pnpm install --prod=false && pnpm run db:generate && pnpm --filter honey-chain-api build
    startCommand: pnpm --filter honey-chain-api start:prod
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: honey-chain-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRY
        value: 15m
      - key: JWT_REFRESH_EXPIRY
        value: 7d
      - key: OTP_MOCK_ENABLED
        value: "true"
      - key: QR_HMAC_SECRET
        generateValue: true

  # ==========================================
  # Honey Chain AI Service (FastAPI + PyTorch)
  # ==========================================
  - type: web
    name: honey-chain-ai
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./services/ai-service/Dockerfile
    dockerContext: ./services/ai-service

# ==========================================
# Managed PostgreSQL Database
# ==========================================
databases:
  - name: honey-chain-db
    plan: free
    region: oregon
    databaseName: honeychain
    user: honeychain_user
